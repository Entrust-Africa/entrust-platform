name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests run against the Postgres service. Builds never connect to the database;
      # the other values only satisfy config checks.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-never-used-outside-ci
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start API
        run: pnpm --filter @entrust/api start > /tmp/entrust-api.log 2>&1 &
      - name: Start CLEAR
        run: pnpm --filter @entrust/clear start > /tmp/entrust-clear.log 2>&1 &
      - name: Wait for API and CLEAR
        run: |
          for attempt in {1..60}; do
            api_ready=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:4000/v1/health || true)
            clear_ready=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/sign-in || true)
            if [ "$api_ready" = "200" ] && [ "$clear_ready" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/entrust-api.log
          cat /tmp/entrust-clear.log
          exit 1
      - name: Run Playwright auth tests
        run: pnpm test:e2e
      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
