name: Deploy to production

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  # Decides whether this run may deploy, and which commit. Every other job waits for it and checks out its commit.
  #
  # A `workflow_run` filter on `branches: [main]` matches the head branch *name* of the CI run, and a fork's pull request
  # can name its branch main. So the run has to come from a push to main in this repository, not just carry the name.
  # "Run workflow" deploys main only, and only a commit CI has passed on, so an unmerged branch never reaches production.
  gate:
    name: Check what may deploy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: >-
      ${{
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - id: commit
        name: Pick the commit and check CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=success" --jq '.total_count')
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::CI hasn't passed on a push of $SHA to main, so it can't be deployed."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  migrate-db:
    name: Apply Production Database Migrations
    needs: gate
    environment: production
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: Ensure staff organization is seeded
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm --filter @entrust/db exec node -e '
            const { Pool } = require("pg");
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            async function seed() {
              await pool.query(`
                INSERT INTO core.organization (id, name, slug, created_at)
                VALUES (\x27entrust-staff-prod\x27, \x27Entrust Africa\x27, \x27entrust\x27, NOW())
                ON CONFLICT (id) DO NOTHING;
              `);
              console.log("Verified entrust-staff-prod organization in database.");
              await pool.end();
            }
            seed().catch((err) => { console.error(err); process.exit(1); });
          '

  deploy-api:
    name: Deploy API Worker
    needs: [gate, migrate-db]
    environment: production
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The commit goes in as a plain variable, so /v1/health says which build is answering and the smoke test can wait
      # for this one. Every other setting is a secret, which `wrangler deploy` keeps.
      - name: Deploy apps/api to Cloudflare
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ needs.gate.outputs.sha }}
          # Cloudflare's errors are often just "unknown error"; the debug log has the request and response behind them.
          WRANGLER_LOG: debug
        run: pnpm --filter @entrust/api exec wrangler deploy --var "GIT_COMMIT:$SHA" --message "Deploy $SHA"
      # The runner is thrown away after the job, so print wrangler's log file here. Printed, not uploaded as an artifact:
      # GitHub masks secret values in job output but not in artifacts.
      - name: Show wrangler's log
        if: failure()
        run: |
          shopt -s nullglob
          for f in ~/.config/.wrangler/logs/*.log; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done

  # CLEAR, TRADE, the Summit page and the email worker run on Railway. Railway cannot watch the repository (nobody in the
  # project has GitHub access), so this job uploads the commit with a project token. It runs only after CI has passed and
  # the migrations and the API are live, so an app never deploys before the API it needs.
  deploy-railway:
    name: Deploy ${{ matrix.service }} (Railway)
    needs: [gate, deploy-api]
    environment: production
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        service: [entrust-trade, entrust-clear, entrust-summit, entrust-mizan, entrust-website, entrust-worker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the Railway CLI
        run: npm install --global @railway/cli@5.71.0
      # `railway up` is run detached and the deployment's status is read afterwards. Railway skips a deployment when none of
      # the service's watched paths changed (a merge that only touches docs or workflows), and `railway up --ci`, which
      # follows the build log, then waits forever and holds the deploy lock.
      - name: Upload ${{ matrix.service }} and wait for Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ matrix.service }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "::error::The RAILWAY_TOKEN secret is not set."; exit 1; }
          newest() {
            railway deployment list --service "$SERVICE" --environment production --json |
              python3 -c "import sys,json; l=json.load(sys.stdin); x=l[0] if l else {}; print(x.get('id',''), x.get('status',''))"
          }
          read -r before _ < <(newest)
          railway up --service "$SERVICE" --environment production --detach
          for _ in $(seq 1 120); do
            read -r id status < <(newest)
            if [ -n "$id" ] && [ "$id" != "$before" ]; then
              echo "$SERVICE: $status"
              case "$status" in
                SUCCESS) exit 0 ;;
                SKIPPED) echo "Nothing this service uses changed, so Railway skipped the build."; exit 0 ;;
                REMOVED) echo "A newer deployment replaced this one."; exit 0 ;;
                FAILED|CRASHED)
                  echo "::error::$SERVICE deployment $status, so its previous build is still running against the new API and schema. See: railway logs --build --service $SERVICE. To go back to the previous release, run the \"Roll back production\" workflow."
                  exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "::error::$SERVICE did not finish deploying within 20 minutes."
          exit 1

  smoke-test:
    name: Post-Deployment Smoke Verification
    needs: [gate, deploy-api, deploy-railway]
    environment: production
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # The addresses people use, not the copies on workers.dev. A new Railway build takes a minute or two to start
      # answering, so each check retries for up to five minutes.
      # The API has to be the build this run deployed, not the one before it, and it has to reach the database.
      - name: Verify the new API is the one answering
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          for _ in $(seq 1 30); do
            health=$(curl -s --max-time 15 https://api.entrust-africa.com/v1/health || true)
            commit=$(printf '%s' "$health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit') or '')" 2>/dev/null || true)
            if [ "$commit" = "$SHA" ]; then
              echo "API is on $SHA"
              configured=$(printf '%s' "$health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('configured'))")
              [ "$configured" = "True" ] || echo "::warning::The API says a production setting is missing. Its logs say which ([config:error])."
              break
            fi
            sleep 10
          done
          [ "$commit" = "$SHA" ] || { echo "::error::The API still answers with ${commit:-no commit}, not $SHA."; exit 1; }
          # A certificate code that can't exist: the answer has to come from the database, as a 404 with the API's error body.
          status=$(curl -s -o /tmp/certificate.json -w "%{http_code}" --max-time 15 https://api.entrust-africa.com/v1/trade/certificates/SMOKE-0000-NONE/public || true)
          if [ "$status" != "404" ] || ! grep -q '"not_found"' /tmp/certificate.json; then
            echo "::error::The API couldn't look up a certificate (HTTP $status): $(cat /tmp/certificate.json)"
            exit 1
          fi

      - name: Verify the live sites answer
        run: |
          check() {
            local name="$1" url="$2" status=""
            for _ in $(seq 1 30); do
              status=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 15 "$url" || true)
              if [ "$status" = "200" ]; then echo "$name: 200"; return 0; fi
              sleep 10
            done
            echo "::error::$name ($url) answered $status"
            return 1
          }
          failed=0
          check "API health" "https://api.entrust-africa.com/v1/health" || failed=1
          check "CLEAR sign-in" "https://clear.entrust-africa.com/sign-in" || failed=1
          check "TRADE sign-in" "https://trade.entrust-africa.com/sign-in" || failed=1
          check "Summit page" "https://adtis.entrust-africa.com" || failed=1
          check "MIZAN sign-in" "https://mizan.entrust-africa.com/sign-in" || failed=1
          check "Website" "https://entrust-africa.com" || failed=1
          exit $failed

      # Nothing answers HTTP here, so ask Railway whether the worker's newest deployment is running.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify the email worker is running
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install --global @railway/cli@5.71.0
          for _ in $(seq 1 60); do
            status=$(railway deployment list --service entrust-worker --environment production --json | python3 -c "import sys,json; print(next((x['status'] for x in json.load(sys.stdin) if x['status'] not in ('SKIPPED', 'REMOVED')), 'NONE'))")
            echo "entrust-worker: $status"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "::error::The email worker deployment is $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::The email worker did not come up within ten minutes"
          exit 1
