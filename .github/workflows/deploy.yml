name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  migrate-db:
    name: Apply Production Database Migrations
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: Ensure staff organization is seeded
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm --filter @entrust/db exec node -e '
            const { Pool } = require("pg");
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            async function seed() {
              await pool.query(`
                INSERT INTO core.organization (id, name, slug, created_at)
                VALUES (\x27entrust-staff-prod\x27, \x27Entrust Africa\x27, \x27entrust\x27, NOW())
                ON CONFLICT (id) DO NOTHING;
              `);
              console.log("Verified entrust-staff-prod organization in database.");
              await pool.end();
            }
            seed().catch((err) => { console.error(err); process.exit(1); });
          '

  deploy-api:
    name: Deploy API Worker
    needs: migrate-db
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy apps/api to Cloudflare
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @entrust/api run deploy

  deploy-clear:
    name: Deploy CLEAR Platform (OpenNext)
    needs: deploy-api
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build & Deploy apps/clear
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: https://entrust-api.sw-minasefikadu.workers.dev
          API_URL: https://entrust-api.sw-minasefikadu.workers.dev
        run: pnpm --filter @entrust/clear run deploy

  deploy-website:
    name: Deploy Website (OpenNext)
    needs: migrate-db
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build & Deploy apps/website
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @entrust/website run deploy

  smoke-test:
    name: Post-Deployment Smoke Verification
    needs: [deploy-api, deploy-clear, deploy-website]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify API Health Endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://entrust-api.sw-minasefikadu.workers.dev/v1/health")
          echo "API Health status: $status"
          if [ "$status" != "200" ]; then
            echo "API Health check failed with status $status"
            exit 1
          fi

      - name: Verify CLEAR Web App Endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://entrust-clear.sw-minasefikadu.workers.dev/sign-in")
          echo "CLEAR Sign-in status: $status"
          if [ "$status" != "200" ]; then
            echo "CLEAR check failed with status $status"
            exit 1
          fi

      - name: Verify Website Endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://entrust-website.sw-minasefikadu.workers.dev")
          echo "Website status: $status"
          if [ "$status" != "200" ]; then
            echo "Website check failed with status $status"
            exit 1
          fi
